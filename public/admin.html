<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PluginService — 管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell shell-admin">
      <nav class="topnav" aria-label="主导航">
        <a class="nav-brand" href="/">PluginService</a>
        <div class="nav-links">
          <a href="/">商店</a>
          <a href="/admin" aria-current="page">管理</a>
        </div>
      </nav>

      <header class="page-header">
        <h1>包管理</h1>
        <p class="lede">
          使用与 <code>dotnet nuget push</code> 相同的 API Key 管理私有源：上传与硬删除。
        </p>
      </header>

      <main>
        <!-- API Key 门禁（与 NUGET_API_KEY / CLI 相同） -->
        <section id="gate-panel" class="panel">
          <h2 class="panel-title">API Key</h2>
          <form id="gate-form" class="gate-form" novalidate>
            <label class="field">
              <span>NUGET_API_KEY</span>
              <input
                id="access-key"
                name="accessKey"
                type="password"
                autocomplete="off"
                placeholder="与环境密钥 / CLI --api-key 一致"
                required
              />
            </label>
            <div class="actions">
              <button type="submit" id="gate-btn">进入管理</button>
              <button type="button" id="logout-btn" class="btn-ghost" hidden>
                清除密钥
              </button>
            </div>
            <p id="gate-status" class="status" role="status" aria-live="polite"></p>
          </form>
        </section>

        <div id="admin-body" hidden>
          <!-- 上传 + 预览 -->
          <section class="panel" aria-labelledby="upload-heading">
            <h2 id="upload-heading" class="panel-title">上传包</h2>
            <form id="upload-form" novalidate>
              <label class="field file-field">
                <span>包文件（.nupkg）</span>
                <input
                  id="package-file"
                  name="package"
                  type="file"
                  accept=".nupkg,application/octet-stream"
                  required
                />
                <p id="file-name" class="file-name">未选择文件</p>
              </label>

              <div id="preview-panel" class="pkg-preview" hidden>
                <div class="pkg-preview-head">
                  <img
                    id="preview-icon"
                    class="pkg-preview-icon"
                    alt=""
                    hidden
                  />
                  <div class="pkg-preview-identity">
                    <p id="preview-idver" class="pkg-preview-idver"></p>
                    <p id="preview-title" class="pkg-preview-title"></p>
                    <p id="preview-conflict" class="pkg-preview-conflict" hidden></p>
                  </div>
                </div>
                <dl class="pkg-preview-meta">
                  <div>
                    <dt>作者</dt>
                    <dd id="preview-authors">—</dd>
                  </div>
                  <div>
                    <dt>大小</dt>
                    <dd id="preview-size">—</dd>
                  </div>
                  <div>
                    <dt>项目</dt>
                    <dd id="preview-project">—</dd>
                  </div>
                  <div class="pkg-preview-full">
                    <dt>标签</dt>
                    <dd id="preview-tags">—</dd>
                  </div>
                  <div class="pkg-preview-full">
                    <dt>描述</dt>
                    <dd id="preview-description">—</dd>
                  </div>
                </dl>
                <div id="preview-deps-wrap" class="pkg-preview-block" hidden>
                  <h3 class="pkg-preview-sub">依赖</h3>
                  <ul id="preview-deps" class="pkg-preview-deps"></ul>
                </div>
                <div id="preview-notes-wrap" class="pkg-preview-block" hidden>
                  <h3 class="pkg-preview-sub">Release Notes</h3>
                  <div id="preview-notes" class="md-body doc-panel"></div>
                </div>
                <div id="preview-readme-wrap" class="pkg-preview-block" hidden>
                  <h3 class="pkg-preview-sub">README</h3>
                  <div id="preview-readme" class="md-body doc-panel"></div>
                </div>
              </div>
              <div class="busy-row">
                <p id="preview-status" class="status" role="status" aria-live="polite"></p>
                <button type="button" id="cancel-busy-btn" class="btn-ghost btn-sm" hidden>
                  取消
                </button>
              </div>

              <div class="actions">
                <button type="submit" id="submit-btn" disabled>上传并发布</button>
              </div>
              <p id="upload-status" class="status" role="status" aria-live="polite"></p>
            </form>
          </section>

          <!-- 包列表 -->
          <section class="panel" aria-labelledby="list-heading">
            <div class="admin-list-head">
              <h2 id="list-heading" class="panel-title">已发布的包</h2>
              <form id="list-search-form" class="admin-search" role="search">
                <label class="sr-only" for="list-q">搜索包</label>
                <input
                  id="list-q"
                  type="search"
                  placeholder="按 id / 标题筛选"
                  autocomplete="off"
                />
                <button type="submit">刷新</button>
              </form>
            </div>
            <p id="list-status" class="status" role="status" aria-live="polite"></p>
            <div id="package-list" class="admin-pkg-list"></div>
          </section>

          <section class="panel meta" aria-labelledby="source-heading">
            <h2 id="source-heading" class="panel-title">源地址</h2>
            <p>
              Service Index：
              <a id="service-index-link" href="/v3/index.json"
                ><code id="service-index-url">/v3/index.json</code></a
              >
            </p>
          </section>
        </div>
      </main>
    </div>
    <script src="/admin.js" type="module"></script>
  </body>
</html>
