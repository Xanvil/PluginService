<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PluginService — 上传包</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell shell-upload">
      <nav class="topnav" aria-label="主导航">
        <a class="nav-brand" href="/">PluginService</a>
        <div class="nav-links">
          <a href="/">商店</a>
          <a href="/upload" aria-current="page">上传</a>
        </div>
      </nav>

      <header class="page-header">
        <h1>上传 NuGet 包</h1>
        <p class="lede">
          选择 <code>.nupkg</code> 并填写 API Key。也可使用
          <code>dotnet nuget push</code>。
        </p>
      </header>

      <main>
        <form id="upload-form" class="panel" novalidate>
          <label class="field">
            <span>API Key</span>
            <input
              id="api-key"
              name="apiKey"
              type="password"
              autocomplete="off"
              placeholder="与 NUGET_API_KEY 一致"
              required
            />
          </label>

          <label class="field file-field">
            <span>包文件（.nupkg）</span>
            <input
              id="package-file"
              name="package"
              type="file"
              accept=".nupkg,application/octet-stream"
              required
            />
            <p id="file-name" class="file-name">未选择文件</p>
          </label>

          <div class="actions">
            <button type="submit" id="submit-btn">上传并发布</button>
          </div>

          <p id="status" class="status" role="status" aria-live="polite"></p>
        </form>

        <section class="panel meta" aria-labelledby="source-heading">
          <h2 id="source-heading">源地址</h2>
          <p>
            Service Index：
            <a id="service-index-link" href="/v3/index.json"
              ><code id="service-index-url">/v3/index.json</code></a
            >
          </p>
          <p class="hint">
            <code
              >dotnet nuget add source &lt;上述 URL&gt; -n PluginService</code
            >
          </p>
        </section>
      </main>
    </div>
    <script src="/upload.js" type="module"></script>
  </body>
</html>
