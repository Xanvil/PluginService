# Cloudflare Worker：私有 NuGet V3 源
name = "plugin-nuget"
account_id = "53158c2918f4c0a6d4d3023a9d5aba0c"
main = "src/index.ts"
# 与当前已安装的 workerd 运行时对齐（wrangler 3.x 最高约 2025-07-18）
compatibility_date = "2025-07-18"

# 推送与管理页共用密钥，通过 secret 注入，勿写入本文件：
#   wrangler secret put NUGET_API_KEY

# 静态资源；Worker 优先处理 /v3/*
# html_handling=none：禁止 / ↔ /index.html 的 307，避免与 Worker 回退互相打架
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[r2_buckets]]
binding = "PACKAGES"
bucket_name = "plugin-nuget-packages"

[[d1_databases]]
binding = "DB"
database_name = "plugin-nuget"
# 首次部署前执行：wrangler d1 create plugin-nuget，并将返回的 database_id 填到此处
database_id = "daf39450-8daf-49fc-aebf-323767a032eb"
migrations_dir = "migrations"

# Workers Logs；traces 需较新 Wrangler（v4+）时可再加 [observability.traces]
[observability]
enabled = true
